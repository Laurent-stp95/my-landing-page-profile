<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable · Laurent Del Braccio</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages sert cette page pour n'importe quelle adresse inconnue :
       liens et icône en adresse absolue, styles intégrés. -->
  <link rel="icon" type="image/svg+xml" href="https://laurent-stp95.github.io/my-landing-page-profile/favicon.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfbfd;
      --bg-elevated: #f5f5f7;
      --btn-hover: #ebebef;
      --text: #1d1d1f;
      --text-muted: #515154;
      --text-subtle: #6e6e73;
      --accent-text: #005bb8;
      --accent-solid: #0066cc;
      --accent-solid-hover: #0058b0;
      --border: #d2d2d7;
      --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
              'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;
      /* Échelle typographique : identique à css/variables.css */
      --fs-sm: 0.8125rem;
      --fs-label: 0.875rem;
      --fs-small: 0.9375rem;
      --fs-body-lg: 1.125rem;
      --fs-headline: clamp(2rem, 1.4rem + 2.4vw, 3.25rem);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-elevated: #1d1d1f;
        --btn-hover: #2c2c2e;
        --text: #f5f5f7;
        --text-muted: #c7c7cc;
        --text-subtle: #a1a1a6;
        --accent-text: #4aa8ff;
        --border: #38383a;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(0, 113, 227, 0.16); }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 6vw;
      max-width: 1100px;
      margin: 0 auto;
    }

    .top {
      height: 56px;
      display: flex;
      align-items: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: var(--fs-body-lg);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent-text); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 6rem;
    }

    .code {
      margin: 0 0 1.5rem;
      font-family: var(--mono);
      font-size: var(--fs-label);
      color: var(--text-subtle);
    }

    .code strong {
      font-weight: 500;
      color: var(--text);
    }

    h1 {
      margin: 0;
      max-width: 14ch;
      font-size: var(--fs-headline);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    p.lead {
      margin: 1.5rem 0 0;
      max-width: 46ch;
      font-size: var(--fs-body-lg);
      line-height: 1.55;
      color: var(--text-muted);
      text-wrap: pretty;
    }

    .actions {
      margin-top: 2.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0.7rem 1.5rem;
      border-radius: 9999px;
      font-size: var(--fs-small);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text);
      background: var(--bg-elevated);
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn:hover { background: var(--btn-hover); }

    .btn--primary { color: #fff; background: var(--accent-solid); }
    .btn--primary:hover { color: #fff; background: var(--accent-solid-hover); }

    a:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 3px;
    }

    .logo:focus-visible { border-radius: 8px; }

    footer {
      padding: 1.75rem 0;
      border-top: 1px solid var(--border);
      font-size: var(--fs-sm);
      color: var(--text-subtle);
    }

    @media (max-width: 600px) {
      .page { padding: 0 5vw; }
      .top { height: 52px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a href="https://laurent-stp95.github.io/my-landing-page-profile/" class="logo" aria-label="ldb.pm, retour à l'accueil">ldb<span>.pm</span></a>
    </header>

    <main>
      <p class="code"><strong>404</strong> · version introuvable</p>
      <h1>Cette page n'a jamais été livrée.</h1>
      <p class="lead">Le lien est peut-être ancien, ou l'adresse contient une faute de frappe. Le reste du site, lui, est bien en production.</p>
      <div class="actions">
        <a href="https://laurent-stp95.github.io/my-landing-page-profile/" class="btn btn--primary">Retour à l'accueil</a>
        <a href="https://laurent-stp95.github.io/my-landing-page-profile/cv.html" class="btn">Voir mon parcours</a>
      </div>
    </main>

    <footer>© 2026 Laurent Del Braccio · Product Builder</footer>
  </div>
</body>
</html>
