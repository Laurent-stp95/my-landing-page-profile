<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable · Laurent Del Braccio</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages sert cette page pour n'importe quelle adresse inconnue :
       liens et icône en adresse absolue, styles intégrés. -->
  <link rel="icon" type="image/svg+xml" href="https://laurent-stp95.github.io/my-landing-page-profile/favicon.svg">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('https://laurent-stp95.github.io/my-landing-page-profile/assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
    }

    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: url('https://laurent-stp95.github.io/my-landing-page-profile/assets/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');
    }

    /* Valeurs identiques à css/variables.css */
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
      --text-muted: #595959;
      --accent-solid: #4d49fc;
      --accent-solid-hover: #3b37e6;
      --tint-lime: #e4ff97;
      --border: #e2e2e2;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-label: 1rem;
      --fs-body: 1.125rem;
      --fs-headline: clamp(2.5rem, 1.6rem + 3vw, 3.5rem);
      --fw-light: 330;
      --fw-regular: 400;
      --fw-medium: 480;
      --gutter: max(6vw, calc((100% - 1200px) / 2));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-feature-settings: 'kern';
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(77, 73, 252, 0.12); }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 var(--gutter);
    }

    .top {
      height: 64px;
      display: flex;
      align-items: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: var(--fs-body);
      font-weight: var(--fw-regular);
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent-solid); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 5rem 0 7.5rem;
    }

    .code {
      margin: 0 0 2rem;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--tint-lime);
    }

    h1 {
      margin: 0;
      max-width: 14ch;
      font-size: var(--fs-headline);
      font-weight: var(--fw-light);
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    p.lead {
      margin: 1.5rem 0 0;
      max-width: 46ch;
      font-size: var(--fs-body);
      line-height: 1.55;
      color: var(--text-muted);
      text-wrap: pretty;
    }

    .actions {
      margin-top: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.5rem 1.125rem;
      border: 1px solid var(--text);
      border-radius: 8px;
      font-size: var(--fs-label);
      font-weight: var(--fw-regular);
      letter-spacing: -0.01em;
      color: var(--text);
      background: transparent;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn:hover { background: rgba(0, 0, 0, 0.05); }

    .btn--primary {
      padding: 0.625rem 1.25rem;
      border-color: var(--accent-solid);
      border-radius: 9999px;
      font-weight: var(--fw-medium);
      color: #fff;
      background: var(--accent-solid);
    }

    .btn--primary:hover {
      border-color: var(--accent-solid-hover);
      background: var(--accent-solid-hover);
    }

    a:focus-visible {
      outline: 2px solid var(--accent-solid);
      outline-offset: 3px;
    }

    footer {
      padding: 1.75rem 0;
      border-top: 1px solid var(--border);
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .page { padding: 0 5vw; }
      .top { height: 56px; }
      .actions { flex-direction: column; width: 100%; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a href="https://laurent-stp95.github.io/my-landing-page-profile/" class="logo" aria-label="ldb.pm, retour à l'accueil">ldb<span>.pm</span></a>
    </header>

    <main>
      <p class="code">404 · version introuvable</p>
      <h1>Cette page n'a jamais été livrée.</h1>
      <p class="lead">Le lien est peut-être ancien, ou l'adresse contient une faute de frappe. Le reste du site, lui, est bien en production.</p>
      <div class="actions">
        <a href="https://laurent-stp95.github.io/my-landing-page-profile/" class="btn btn--primary">Retour à l'accueil</a>
        <a href="https://laurent-stp95.github.io/my-landing-page-profile/cv.html" class="btn">Voir mon parcours</a>
      </div>
    </main>

    <footer>© 2026 Laurent Del Braccio · Product Builder</footer>
  </div>
</body>
</html>
